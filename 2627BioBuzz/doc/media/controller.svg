<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="touchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1160" height="660" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="580" y="38" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">FTC 32722 BioBuzz — Controller Layout</text>
  <text x="580" y="60" text-anchor="middle" fill="#94A3B8" font-size="13">PlayStation Controller Layout • DriverControlled (TeleOp) • E-Stop active in all OpModes</text>

  <!-- ==================== PLAYSTATION CONTROLLER SILHOUETTE ==================== -->
  <g id="playstation-controller" filter="url(#shadow)">
    <!-- L2 Trigger -->
    <path d="M 358 170 L 368 142 Q 373 132 388 132 L 424 132 Q 437 132 441 142 L 446 170 Z" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="402" y="156" text-anchor="middle" fill="#FECACA" font-size="12.5" font-weight="700">L2</text>

    <!-- R2 Trigger -->
    <path d="M 714 170 L 719 142 Q 723 132 736 132 L 772 132 Q 787 132 792 142 L 802 170 Z" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="758" y="156" text-anchor="middle" fill="#FECACA" font-size="12.5" font-weight="700">R2</text>

    <!-- L1 Bumper -->
    <rect x="352" y="166" width="96" height="24" rx="10" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="400" y="182" text-anchor="middle" fill="#E0E7FF" font-size="12" font-weight="700">L1</text>

    <!-- R1 Bumper -->
    <rect x="712" y="166" width="96" height="24" rx="10" fill="#312E81" stroke="#818CF8" stroke-width="2"/>
    <text x="760" y="182" text-anchor="middle" fill="#E0E7FF" font-size="12" font-weight="700">R1</text>

    <!-- DualSense / DualShock Main Body -->
    <path d="
      M 378 188
      C 334 188, 306 218, 298 265
      L 278 398
      C 270 448, 288 492, 326 495
      C 356 498, 382 465, 412 406
      C 424 388, 444 384, 474 384
      L 686 384
      C 716 384, 736 388, 748 406
      C 778 465, 804 498, 834 495
      C 872 492, 890 448, 882 398
      L 862 265
      C 854 218, 826 188, 782 188
      Z"
      fill="url(#bodyGrad)" stroke="#475569" stroke-width="2.5"/>

    <!-- Center Touchpad -->
    <rect x="498" y="196" width="164" height="78" rx="12" fill="url(#touchGrad)" stroke="#475569" stroke-width="2"/>
    <line x1="504" y1="202" x2="656" y2="202" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.55"/>
    <text x="580" y="240" text-anchor="middle" fill="#64748B" font-size="10.5" font-weight="600">TOUCHPAD</text>

    <!-- SHARE Button (Left of Touchpad) -->
    <rect x="462" y="214" width="16" height="28" rx="7" fill="#422006" stroke="#FACC15" stroke-width="2"/>
    <text x="470" y="255" text-anchor="middle" fill="#FEF08A" font-size="8.5" font-weight="700">SHARE</text>

    <!-- OPTIONS Button (Right of Touchpad) -->
    <rect x="682" y="214" width="16" height="28" rx="7" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <text x="690" y="255" text-anchor="middle" fill="#94A3B8" font-size="8.5" font-weight="700">OPT</text>

    <!-- PS / Team Badge -->
    <circle cx="580" cy="304" r="15" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="580" y="308" text-anchor="middle" fill="#38BDF8" font-size="8.5" font-weight="700">32722</text>

    <!-- D-Pad (Top-Left) -->
    <g transform="translate(395, 268)">
      <path d="M -13 -37 L 13 -37 L 13 -13 L 37 -13 L 37 13 L 13 13 L 13 37 L -13 37 L -13 13 L -37 13 L -37 -13 L -13 -13 Z"
            fill="#0F172A" stroke="#64748B" stroke-width="2"/>
      <polygon points="0,-30 -6,-21 6,-21" fill="#94A3B8"/>
      <polygon points="0,30 -6,21 6,21" fill="#94A3B8"/>
      <polygon points="-30,0 -21,-6 -21,6" fill="#94A3B8"/>
      <polygon points="30,0 21,-6 21,6" fill="#94A3B8"/>
    </g>

    <!-- PlayStation Face Buttons (Top-Right) -->
    <!-- Triangle (Top - Green) -->
    <circle cx="765" cy="228" r="18" fill="#052E16" stroke="#34D399" stroke-width="2.5"/>
    <polygon points="765,218 775,235 755,235" fill="none" stroke="#6EE7B7" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Square (Left - Pink) -->
    <circle cx="725" cy="268" r="18" fill="#500724" stroke="#F472B6" stroke-width="2.5"/>
    <rect x="717" y="260" width="16" height="16" rx="2" fill="none" stroke="#FBCFE8" stroke-width="2.4"/>

    <!-- Circle (Right - Red) -->
    <circle cx="805" cy="268" r="18" fill="#450A0A" stroke="#F87171" stroke-width="2.5"/>
    <circle cx="805" cy="268" r="8.5" fill="none" stroke="#FECACA" stroke-width="2.4"/>

    <!-- Cross (Bottom - Blue) -->
    <circle cx="765" cy="308" r="18" fill="#082F49" stroke="#60A5FA" stroke-width="2.5"/>
    <line x1="758" y1="301" x2="772" y2="315" stroke="#BFDBFE" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="772" y1="301" x2="758" y2="315" stroke="#BFDBFE" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Symmetrical Thumbsticks (Bottom-Center) -->
    <!-- Left Stick (L3) -->
    <circle cx="484" cy="358" r="38" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <circle cx="484" cy="358" r="25" fill="url(#stickGrad)" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="484" y="362" text-anchor="middle" fill="#EDE9FE" font-size="11" font-weight="700">L3</text>

    <!-- Right Stick (R3) -->
    <circle cx="676" cy="358" r="38" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <circle cx="676" cy="358" r="25" fill="url(#stickGrad)" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="676" y="362" text-anchor="middle" fill="#EDE9FE" font-size="11" font-weight="700">R3</text>
  </g>

  <!-- ==================== CALLOUTS ==================== -->
  <!-- SHARE: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-SHARE">
    <polyline points="470,214 470,128" fill="none" stroke="#FACC15" stroke-width="2"/>
    <circle cx="470" cy="214" r="3.5" fill="#FACC15"/>
    <rect x="265" y="80" width="260" height="48" rx="8" fill="#1E293B" stroke="#FACC15" stroke-width="1.8"/>
    <text x="277" y="100" fill="#FEF08A" font-size="12.5" font-weight="700">SHARE — Hold 0.5s: Clear E-Stops</text>
    <text x="277" y="117" fill="#CBD5E1" font-size="11">Releases global &amp; subsystem E-Stops</text>
  </g>

  <!-- OPTIONS: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-OPTIONS">
    <polyline points="690,214 690,128" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="690" cy="214" r="3.5" fill="#475569"/>
    <rect x="635" y="80" width="260" height="48" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.8"/>
    <text x="647" y="100" fill="#94A3B8" font-size="12.5" font-weight="700">OPTIONS — FTC System Reserved</text>
    <text x="647" y="117" fill="#64748B" font-size="11">OPTIONS + X/O assigns gamepad 1/2</text>
  </g>

  <!-- L2: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-L2">
    <polyline points="370,148 252,148" fill="none" stroke="#EF4444" stroke-width="2"/>
    <circle cx="370" cy="148" r="3.5" fill="#EF4444"/>
    <rect x="20" y="128" width="232" height="50" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.8"/>
    <text x="32" y="148" fill="#FCA5A5" font-size="12.5" font-weight="700">L2 + R2 — GLOBAL E-STOP</text>
    <text x="32" y="165" fill="#FECACA" font-size="11">Pull both triggers &gt;85% for 150ms</text>
  </g>

  <!-- L1: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-L1">
    <polyline points="352,178 290,178 252,217" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="352" cy="178" r="3.5" fill="#A78BFA"/>
    <rect x="20" y="192" width="232" height="50" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-width="1.8"/>
    <text x="32" y="212" fill="#DDD6FE" font-size="12.5" font-weight="700">L1 — Slow Speed (50%)</text>
    <text x="32" y="229" fill="#CBD5E1" font-size="11">Precision driving multiplier</text>
  </g>

  <!-- DPAD: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-DPAD">
    <polyline points="358,268 290,268 252,281" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="358" cy="268" r="3.5" fill="#475569"/>
    <rect x="20" y="256" width="232" height="50" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.8"/>
    <text x="32" y="276" fill="#94A3B8" font-size="12.5" font-weight="700">D-Pad — Unassigned</text>
    <text x="32" y="293" fill="#64748B" font-size="11">Available for future mechanisms</text>
  </g>

  <!-- LEFT_STICK: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-LEFT_STICK">
    <polyline points="446,358 252,358" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="446" cy="358" r="3.5" fill="#A78BFA"/>
    <rect x="20" y="330" width="232" height="52" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-width="1.8"/>
    <text x="32" y="350" fill="#DDD6FE" font-size="12.5" font-weight="700">Left Stick — Move / Drive</text>
    <text x="32" y="367" fill="#CBD5E1" font-size="11">Mecanum: Fwd/Back + Strafe | Tank: Left</text>
  </g>

  <!-- R2: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-R2">
    <polyline points="790,148 908,148" fill="none" stroke="#EF4444" stroke-width="2"/>
    <circle cx="790" cy="148" r="3.5" fill="#EF4444"/>
    <rect x="908" y="128" width="232" height="50" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.8"/>
    <text x="920" y="148" fill="#FCA5A5" font-size="12.5" font-weight="700">R2 + L2 — GLOBAL E-STOP</text>
    <text x="920" y="165" fill="#FECACA" font-size="11">Cuts all motor power immediately</text>
  </g>

  <!-- R1: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-R1">
    <polyline points="808,178 870,178 908,217" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="808" cy="178" r="3.5" fill="#A78BFA"/>
    <rect x="908" y="192" width="232" height="50" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-width="1.8"/>
    <text x="920" y="212" fill="#DDD6FE" font-size="12.5" font-weight="700">R1 — Fast Speed (100%)</text>
    <text x="920" y="229" fill="#CBD5E1" font-size="11">Full driving speed multiplier</text>
  </g>

  <!-- TRIANGLE: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-TRIANGLE">
    <polyline points="783,228 865,228 908,274" fill="none" stroke="#34D399" stroke-width="2"/>
    <circle cx="783" cy="228" r="3.5" fill="#34D399"/>
    <rect x="908" y="250" width="232" height="48" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
    <text x="920" y="270" fill="#6EE7B7" font-size="12.5" font-weight="700">△ — Intake Reverse</text>
    <text x="920" y="287" fill="#CBD5E1" font-size="11">Manual reverse pulse (jam clear)</text>
  </g>

  <!-- CIRCLE: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-CIRCLE">
    <polyline points="823,268 870,268 908,330" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="823" cy="268" r="3.5" fill="#38BDF8"/>
    <rect x="908" y="306" width="232" height="48" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="920" y="326" fill="#7DD3FC" font-size="12.5" font-weight="700">○ — Reset Odometry Pose</text>
    <text x="920" y="343" fill="#CBD5E1" font-size="11">Sets (X, Y, Heading) to (0, 0, 0°)</text>
  </g>

  <!-- CROSS: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-CROSS">
    <polyline points="783,308 865,308 908,386" fill="none" stroke="#FB923C" stroke-width="2"/>
    <circle cx="783" cy="308" r="3.5" fill="#FB923C"/>
    <rect x="908" y="362" width="232" height="48" rx="8" fill="#1E293B" stroke="#FB923C" stroke-width="1.8"/>
    <text x="920" y="382" fill="#FDBA74" font-size="12.5" font-weight="700">✕ — Toggle FlyWheel On / Off</text>
    <text x="920" y="399" fill="#CBD5E1" font-size="11">1st press clears FlyWheel Auto E-Stop</text>
  </g>

  <!-- RIGHT_STICK: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-RIGHT_STICK">
    <polyline points="714,358 750,358 750,444 908,444" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="714" cy="358" r="3.5" fill="#A78BFA"/>
    <rect x="908" y="418" width="232" height="52" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-width="1.8"/>
    <text x="920" y="438" fill="#DDD6FE" font-size="12.5" font-weight="700">Right Stick — Turn / Drive</text>
    <text x="920" y="455" fill="#CBD5E1" font-size="11">Mecanum: Turn (X) | Tank: Right (Y)</text>
  </g>

  <!-- SQUARE: EDIT LABEL IN doc/controller-map.json OR DIRECTLY BELOW -->
  <g id="callout-SQUARE">
    <polyline points="725,286 725,469 705,469" fill="none" stroke="#34D399" stroke-width="2"/>
    <circle cx="725" cy="286" r="3.5" fill="#34D399"/>
    <rect x="455" y="444" width="250" height="50" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
    <text x="467" y="464" fill="#6EE7B7" font-size="12.5" font-weight="700">□ — Toggle Intake On / Off</text>
    <text x="467" y="481" fill="#CBD5E1" font-size="11">1st press clears Intake Auto E-Stop</text>
  </g>

  <!-- ==================== FOOTER / LEGEND ==================== -->
  <rect x="20" y="524" width="1120" height="116" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="38" y="548" fill="#F8FAFC" font-size="13.5" font-weight="700">Safety &amp; Editing Guide</text>

  <circle cx="46" cy="572" r="6" fill="#EF4444"/>
  <text x="60" y="576" fill="#E2E8F0" font-size="12"><tspan font-weight="700" fill="#FCA5A5">Global E-Stop:</tspan> Squeeze L2 + R2 (&gt;85% for 150ms) on gamepad1 or gamepad2. Hold SHARE (0.5s) to release.</text>

  <circle cx="46" cy="596" r="6" fill="#FB923C"/>
  <text x="60" y="600" fill="#E2E8F0" font-size="12"><tspan font-weight="700" fill="#FDBA74">Auto E-Stops:</tspan> FlyWheel locks on stall/encoder fault/overcurrent (press ✕ to clear). Intake locks on failed jam recovery/fault (press □ to clear).</text>

  <circle cx="46" cy="620" r="6" fill="#38BDF8"/>
  <text x="60" y="624" fill="#E2E8F0" font-size="12"><tspan font-weight="700" fill="#7DD3FC">Easy Editing:</tspan> Edit labels in doc/controller-map.json and run "python doc/generate_controller.py" to update both controller.svg and CONTROLLER.md.</text>
</svg>
