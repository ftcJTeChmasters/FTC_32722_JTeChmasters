<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="touchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="560" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="500" y="38" text-anchor="middle" fill="#F8FAFC" font-size="21" font-weight="700">FTC 32722 BioBuzz — PlayStation Controller Reference</text>
  <text x="500" y="60" text-anchor="middle" fill="#94A3B8" font-size="13">Numbers match the table in CONTROLLER.md (edit controls directly in CONTROLLER.md)</text>

  <!-- ==================== PLAYSTATION CONTROLLER SILHOUETTE ==================== -->
  <g id="playstation-controller" filter="url(#shadow)">
    <!-- L2 Trigger -->
    <path d="M 278 168 L 288 140 Q 293 130 308 130 L 344 130 Q 357 130 361 140 L 366 168 Z" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <text x="322" y="154" text-anchor="middle" fill="#E2E8F0" font-size="12.5" font-weight="700">L2</text>

    <!-- R2 Trigger -->
    <path d="M 634 168 L 639 140 Q 643 130 656 130 L 692 130 Q 707 130 712 140 L 722 168 Z" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <text x="678" y="154" text-anchor="middle" fill="#E2E8F0" font-size="12.5" font-weight="700">R2</text>

    <!-- L1 Bumper -->
    <rect x="272" y="164" width="96" height="24" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
    <text x="320" y="180" text-anchor="middle" fill="#E0E7FF" font-size="12" font-weight="700">L1</text>

    <!-- R1 Bumper -->
    <rect x="632" y="164" width="96" height="24" rx="10" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
    <text x="680" y="180" text-anchor="middle" fill="#E0E7FF" font-size="12" font-weight="700">R1</text>

    <!-- DualSense / DualShock Main Body -->
    <path d="
      M 298 186
      C 254 186, 226 216, 218 263
      L 198 396
      C 190 446, 208 490, 246 493
      C 276 496, 302 463, 332 404
      C 344 386, 364 382, 394 382
      L 606 382
      C 636 382, 656 386, 668 404
      C 698 463, 724 496, 754 493
      C 792 490, 810 446, 802 396
      L 782 263
      C 774 216, 746 186, 702 186
      Z"
      fill="url(#bodyGrad)" stroke="#475569" stroke-width="2.5"/>

    <!-- Center Touchpad -->
    <rect x="418" y="194" width="164" height="78" rx="12" fill="url(#touchGrad)" stroke="#475569" stroke-width="2"/>
    <line x1="424" y1="200" x2="576" y2="200" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.55"/>
    <text x="500" y="238" text-anchor="middle" fill="#64748B" font-size="10.5" font-weight="600">TOUCHPAD</text>

    <!-- SHARE Button -->
    <rect x="382" y="212" width="16" height="28" rx="7" fill="#1E293B" stroke="#FACC15" stroke-width="2"/>
    <text x="390" y="253" text-anchor="middle" fill="#FEF08A" font-size="8.5" font-weight="700">SHARE</text>

    <!-- OPTIONS Button -->
    <rect x="602" y="212" width="16" height="28" rx="7" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <text x="610" y="253" text-anchor="middle" fill="#CBD5E1" font-size="8.5" font-weight="700">OPT</text>

    <!-- PS / Team Badge -->
    <circle cx="500" cy="302" r="15" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="500" y="306" text-anchor="middle" fill="#38BDF8" font-size="8.5" font-weight="700">32722</text>

    <!-- D-Pad (Top-Left) -->
    <g transform="translate(315, 266)">
      <path d="M -13 -37 L 13 -37 L 13 -13 L 37 -13 L 37 13 L 13 13 L 13 37 L -13 37 L -13 13 L -37 13 L -37 -13 L -13 -13 Z"
            fill="#0F172A" stroke="#64748B" stroke-width="2"/>
      <polygon points="0,-30 -6,-21 6,-21" fill="#94A3B8"/>
      <polygon points="0,30 -6,21 6,21" fill="#94A3B8"/>
      <polygon points="-30,0 -21,-6 -21,6" fill="#94A3B8"/>
      <polygon points="30,0 21,-6 21,6" fill="#94A3B8"/>
    </g>

    <!-- PlayStation Face Buttons (Top-Right) -->
    <!-- Triangle -->
    <circle cx="685" cy="226" r="18" fill="#052E16" stroke="#34D399" stroke-width="2.5"/>
    <polygon points="685,216 695,233 675,233" fill="none" stroke="#6EE7B7" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Square -->
    <circle cx="645" cy="266" r="18" fill="#500724" stroke="#F472B6" stroke-width="2.5"/>
    <rect x="637" y="258" width="16" height="16" rx="2" fill="none" stroke="#FBCFE8" stroke-width="2.4"/>

    <!-- Circle -->
    <circle cx="725" cy="266" r="18" fill="#450A0A" stroke="#F87171" stroke-width="2.5"/>
    <circle cx="725" cy="266" r="8.5" fill="none" stroke="#FECACA" stroke-width="2.4"/>

    <!-- Cross -->
    <circle cx="685" cy="306" r="18" fill="#082F49" stroke="#60A5FA" stroke-width="2.5"/>
    <line x1="678" y1="299" x2="692" y2="313" stroke="#BFDBFE" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="692" y1="299" x2="678" y2="313" stroke="#BFDBFE" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Symmetrical Thumbsticks (Bottom-Center) -->
    <circle cx="404" cy="356" r="38" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <circle cx="404" cy="356" r="25" fill="url(#stickGrad)" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="404" y="360" text-anchor="middle" fill="#EDE9FE" font-size="11" font-weight="700">L3</text>

    <circle cx="596" cy="356" r="38" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <circle cx="596" cy="356" r="25" fill="url(#stickGrad)" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="596" y="360" text-anchor="middle" fill="#EDE9FE" font-size="11" font-weight="700">R3</text>
  </g>

  <!-- ==================== NUMBERED BUTTON CALLOUT BADGES ==================== -->
  <!-- 5: SHARE -->
  <polyline points="390,212 390,116" fill="none" stroke="#FACC15" stroke-width="2"/>
  <circle cx="390" cy="212" r="3.5" fill="#FACC15"/>
  <rect x="315" y="84" width="150" height="32" rx="16" fill="#1E293B" stroke="#FACC15" stroke-width="1.8"/>
  <text x="390" y="105" text-anchor="middle" fill="#FEF08A" font-size="13" font-weight="700">5 · SHARE</text>

  <!-- 6: OPTIONS -->
  <polyline points="610,212 610,116" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="610" cy="212" r="3.5" fill="#94A3B8"/>
  <rect x="535" y="84" width="150" height="32" rx="16" fill="#1E293B" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="610" y="105" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="700">6 · OPTIONS</text>

  <!-- Left Side -->
  <!-- 1: L2 -->
  <polyline points="290,146 178,146" fill="none" stroke="#EF4444" stroke-width="2"/>
  <circle cx="290" cy="146" r="3.5" fill="#EF4444"/>
  <rect x="34" y="130" width="144" height="32" rx="16" fill="#1E293B" stroke="#EF4444" stroke-width="1.8"/>
  <text x="106" y="151" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="700">1 · L2 Trigger</text>

  <!-- 2: L1 -->
  <polyline points="272,176 210,176 178,204" fill="none" stroke="#818CF8" stroke-width="2"/>
  <circle cx="272" cy="176" r="3.5" fill="#818CF8"/>
  <rect x="34" y="188" width="144" height="32" rx="16" fill="#1E293B" stroke="#818CF8" stroke-width="1.8"/>
  <text x="106" y="209" text-anchor="middle" fill="#C7D2FE" font-size="13" font-weight="700">2 · L1 Bumper</text>

  <!-- 3: D-Pad -->
  <polyline points="278,266 178,266" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="278" cy="266" r="3.5" fill="#94A3B8"/>
  <rect x="34" y="250" width="144" height="32" rx="16" fill="#1E293B" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="106" y="271" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="700">3 · D-Pad</text>

  <!-- 4: Left Stick -->
  <polyline points="366,356 178,356" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="366" cy="356" r="3.5" fill="#A78BFA"/>
  <rect x="34" y="340" width="144" height="32" rx="16" fill="#1E293B" stroke="#A78BFA" stroke-width="1.8"/>
  <text x="106" y="361" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">4 · Left Stick (L3)</text>

  <!-- Right Side -->
  <!-- 7: R2 -->
  <polyline points="710,146 822,146" fill="none" stroke="#EF4444" stroke-width="2"/>
  <circle cx="710" cy="146" r="3.5" fill="#EF4444"/>
  <rect x="822" y="130" width="144" height="32" rx="16" fill="#1E293B" stroke="#EF4444" stroke-width="1.8"/>
  <text x="894" y="151" text-anchor="middle" fill="#FCA5A5" font-size="13" font-weight="700">7 · R2 Trigger</text>

  <!-- 8: R1 -->
  <polyline points="728,176 790,176 822,204" fill="none" stroke="#818CF8" stroke-width="2"/>
  <circle cx="728" cy="176" r="3.5" fill="#818CF8"/>
  <rect x="822" y="188" width="144" height="32" rx="16" fill="#1E293B" stroke="#818CF8" stroke-width="1.8"/>
  <text x="894" y="209" text-anchor="middle" fill="#C7D2FE" font-size="13" font-weight="700">8 · R1 Bumper</text>

  <!-- 9: Triangle -->
  <polyline points="703,226 785,226 822,256" fill="none" stroke="#34D399" stroke-width="2"/>
  <circle cx="703" cy="226" r="3.5" fill="#34D399"/>
  <rect x="822" y="240" width="144" height="32" rx="16" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
  <text x="894" y="261" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="700">9 · △ Triangle</text>

  <!-- 10: Circle -->
  <polyline points="743,266 790,266 822,308" fill="none" stroke="#F87171" stroke-width="2"/>
  <circle cx="743" cy="266" r="3.5" fill="#F87171"/>
  <rect x="822" y="292" width="144" height="32" rx="16" fill="#1E293B" stroke="#F87171" stroke-width="1.8"/>
  <text x="894" y="313" text-anchor="middle" fill="#FECACA" font-size="13" font-weight="700">10 · ○ Circle</text>

  <!-- 11: Cross -->
  <polyline points="703,306 785,306 822,360" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="703" cy="306" r="3.5" fill="#60A5FA"/>
  <rect x="822" y="344" width="144" height="32" rx="16" fill="#1E293B" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="894" y="365" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="700">11 · ✕ Cross</text>

  <!-- 13: Right Stick -->
  <polyline points="634,356 672,356 672,412 822,412" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="634" cy="356" r="3.5" fill="#A78BFA"/>
  <rect x="822" y="396" width="144" height="32" rx="16" fill="#1E293B" stroke="#A78BFA" stroke-width="1.8"/>
  <text x="894" y="417" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700">13 · Right Stick (R3)</text>

  <!-- 12: Square (Bottom-Center) -->
  <polyline points="645,284 645,456 575,456" fill="none" stroke="#F472B6" stroke-width="2"/>
  <circle cx="645" cy="284" r="3.5" fill="#F472B6"/>
  <rect x="425" y="440" width="150" height="32" rx="16" fill="#1E293B" stroke="#F472B6" stroke-width="1.8"/>
  <text x="500" y="461" text-anchor="middle" fill="#FBCFE8" font-size="13" font-weight="700">12 · □ Square</text>

  <!-- Footer hint -->
  <text x="500" y="532" text-anchor="middle" fill="#64748B" font-size="12">Tip: Because this diagram uses button numbers 1–13, you only need to edit CONTROLLER.md when changing button bindings.</text>
</svg>
